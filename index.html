   IDEA: an ink ensō framing a rendered scene: ENSO's ink + the graphics programmer's spheres
   PICTURE: hero ensō with lit spheres; every case study gets its own drawn scene or diagram
   COLOUR and TYPE: paper white / ink black, one sharp vermilion; Archivo 800 + IBM Plex Sans
   LAYOUT: home (hero, featured case studies, other projects, skills, background) + one page per case study */
:root{color-scheme:light dark;
--bg:light-dark(#f7f5f1,#0f0f10);--ink:light-dark(#151414,#efece6);--mute:light-dark(#5d5a55,#a6a199);
--line:light-dark(#dcd7cf,#2a2927);--card:light-dark(#ffffff,#18181a);--red:light-dark(#d7261e,#ff4f3f);
--redsoft:light-dark(#fbe4e1,#3a1714);--blk:light-dark(#151414,#efece6);--night:#121216;--paper:#efece6}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,6vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(28px,3.4vw,36px);line-height:1.05;font-weight:800}
h3{font-size:19px;line-height:1.25;font-weight:700}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(5vw,16px);border-bottom:1px solid var(--line)}
.top>a{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:17px;text-decoration:none;min-height:44px;display:flex;align-items:center}
.top nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.top nav button.nl{font:500 16px "IBM Plex Sans",system-ui,sans-serif;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:8px;cursor:pointer}
.top nav button.nl:hover{background:var(--redsoft)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:6px}
.lang button{font:600 14px "IBM Plex Sans",system-ui,sans-serif;border:0;background:none;color:var(--mute);min-height:40px;padding:0 14px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--blk);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.role{color:var(--red);font-weight:600;margin:0 0 10px}
.lead{font-size:17px;color:var(--mute);max-width:60ch;margin:16px 0 24px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);text-decoration:none;font:600 16px "IBM Plex Sans",system-ui,sans-serif;background:none;color:var(--ink);cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.mail{margin-top:14px;color:var(--mute);font-size:15px}
.art{aspect-ratio:1/1;max-height:520px;width:100%}
.art svg{width:100%;height:100%;display:block}
.stroke{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.6s .2s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stroke{animation:none;stroke-dashoffset:0}}
.sec{border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sub{color:var(--mute);margin:8px 0 0;max-width:60ch}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.fc{display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;color:var(--ink);font:inherit;cursor:pointer;transition:transform .2s,border-color .2s}
.fc:hover{transform:translateY(-3px);border-color:var(--red)}
.fc .pic{aspect-ratio:16/9;background:var(--night)}
.fc .pic svg{width:100%;height:100%;display:block}
.fc .txt{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.fc p{margin:0;color:var(--mute)}
.fc .more{margin-top:auto;padding-top:6px;color:var(--red);font-weight:600}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.status{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.status.wip{background:var(--redsoft);color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:13px;padding:2px 9px;border:1px solid var(--line);border-radius:6px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.skills h3{font-size:16px;margin-bottom:10px;color:var(--red)}
.ink{background:var(--blk);color:var(--bg)}
.ink .mute{color:light-dark(#b9b4ab,#5d5a55)}
.xp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:0 40px}
.xp div{padding:16px 0;border-top:1px solid light-dark(#3a3836,#c9c4bb)}
.xp b{display:block;font-family:Archivo,system-ui,sans-serif;font-size:17px}
.xp small{font-size:14px}
footer{font-size:14px;color:var(--mute)}
/* case study */
.back{margin-bottom:22px}
.chero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:center}
.chero .pic{border-radius:16px;overflow:hidden;background:var(--night);aspect-ratio:16/10}
.chero .pic svg{width:100%;height:100%;display:block}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:20px 0 0;font-size:15px}
.facts dt{color:var(--mute)}.facts dd{margin:0;font-weight:500}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 48px}
.body section h3{margin-bottom:10px;font-size:21px}
.body p{margin:0 0 10px;max-width:62ch}
.body ul{margin:0;padding-left:20px}.body li{margin-bottom:6px;max-width:60ch}
.note{background:var(--redsoft);border-radius:12px;padding:16px 18px;font-size:15px}
.pic img{width:100%;height:100%;object-fit:cover;object-position:65% 50%;display:block;image-rendering:pixelated}
.pic img.photo{image-rendering:auto;object-position:68% 0%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.gal figure{margin:0;background:var(--night);border-radius:14px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.gal figcaption{color:#efece6;font-size:14px;text-align:center;line-height:1.35}.gal figcaption small{display:block;color:#a6a199;font-size:13px}
.spr{--d:150px;width:var(--d);height:var(--d);background-repeat:no-repeat;background-size:calc(var(--d)*8) var(--d);image-rendering:pixelated;animation:play var(--t,1.1s) steps(8) infinite}
.still{width:150px;height:150px;object-fit:contain;image-rendering:pixelated}
@keyframes play{to{background-position:calc(var(--d)*-8) 0}}
@media (prefers-reduced-motion:reduce){.spr{animation:none}}
.credit{color:var(--mute);font-size:14px;margin:14px 0 0}
.nextc{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:860px){.hero,.chero,.body{grid-template-columns:minmax(0,1fr)}.art{max-height:340px;order:-1;margin:0 auto;max-width:340px}.feat{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.top nav button.nl{display:none}}
</style>
